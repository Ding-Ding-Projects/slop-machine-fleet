name: Build and release
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build and publish source-bound service image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ding-ding-projects/slop-machine-fleet:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
  desktop:
    runs-on: windows-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Build unsigned Squirrel installer through supported entrypoint
        shell: cmd
        run: build-installer.bat /s
      - name: Create source and payload manifest
        shell: pwsh
        run: |
          $files = Get-ChildItem apps/desktop/release -File | Where-Object { $_.Extension -in '.exe','.nupkg' -or $_.Name -eq 'RELEASES' }
          Copy-Item release/worker/Fleet.Worker.exe apps/desktop/release/Fleet.Worker.exe
          Copy-Item worker/scripts/Bootstrap-Worker.ps1 apps/desktop/release/Bootstrap-Worker.ps1
          foreach ($mode in @('build','host','docs')) {
            $portable = @(Get-ChildItem "apps/desktop/release/companions/$mode" -File -Filter "Fleet-$mode-*.exe")
            if ($portable.Count -ne 1) { throw "Expected exactly one $mode portable companion." }
            Copy-Item $portable[0].FullName apps/desktop/release/
          }
          $files = @(Get-ChildItem apps/desktop/release -File | Where-Object { $_.Extension -in '.exe','.nupkg','.ps1' -or $_.Name -eq 'RELEASES' })
          if (-not $files) { throw 'Missing desktop release payload.' }
          $tag = 'build-${{ github.run_id }}-${{ github.run_attempt }}'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $worker = @{ version=$version; assetUrl="$base/Fleet.Worker.exe"; assetSha256=(Get-FileHash apps/desktop/release/Fleet.Worker.exe -Algorithm SHA256).Hash.ToLowerInvariant(); bootstrapUrl="$base/Bootstrap-Worker.ps1"; bootstrapSha256=(Get-FileHash apps/desktop/release/Bootstrap-Worker.ps1 -Algorithm SHA256).Hash.ToLowerInvariant() }
          $worker | ConvertTo-Json | Set-Content apps/desktop/release/worker-release.json
          $manifest = @{ source = '${{ github.sha }}'; image = 'ghcr.io/ding-ding-projects/slop-machine-fleet:sha-${{ github.sha }}'; unsigned = $true; files = @($files | ForEach-Object { @{ name=$_.Name; bytes=$_.Length; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash } }) }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content apps/desktop/release/source-manifest.json
      - name: Publish unique normal release and verify stored state
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'build-${{ github.run_id }}-${{ github.run_attempt }}'
          $assets = @(Get-ChildItem apps/desktop/release -File | Where-Object { $_.Extension -in '.exe','.nupkg','.json','.ps1' -or $_.Name -eq 'RELEASES' } | ForEach-Object FullName)
          gh release create $tag @assets --target '${{ github.sha }}' --title "Slop Machine Fleet $tag" --notes 'Source-bound unsigned Windows desktop client and shared service image. See the attached manifest. Runtime and installation acceptance are tracked separately.' --repo '${{ github.repository }}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $release = gh release view $tag --repo '${{ github.repository }}' --json isDraft,isPrerelease,assets,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -or $release.isDraft -or $release.isPrerelease -or $release.tagName -ne $tag) { throw 'Stored release verification failed.' }
          foreach ($asset in $assets) { if (-not ($release.assets | Where-Object name -eq ([IO.Path]::GetFileName($asset)))) { throw 'A published release asset is missing.' } }
