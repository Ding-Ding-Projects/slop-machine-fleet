name: Publication privacy
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-language:
    name: Publication language
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Require reviewed scanner pin
        shell: pwsh
        env:
          SCANNER_REVISION: ${{ vars.PUBLICATION_SCANNER_REVISION }}
        run: |
          if ($env:SCANNER_REVISION -cnotmatch '^[a-f0-9]{40}$') { throw 'Reviewed scanner revision unavailable; privacy verification is incomplete.' }
      - name: Checkout trusted scanner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ vars.PUBLICATION_SCANNER_REVISION }}
          path: trusted
          persist-credentials: false
      - name: Checkout candidate as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.0'
      - name: Prepare Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.2'
      - name: Provision verified font decoders before policy ingestion
        shell: pwsh
        run: |
          $requirements = Join-Path $env:GITHUB_WORKSPACE 'trusted/scripts/publication/font-requirements.txt'
          $fontPython = Join-Path $env:RUNNER_TEMP 'publication-font-python/Scripts/python.exe'
          python -m venv (Join-Path $env:RUNNER_TEMP 'publication-font-python')
          if ($LASTEXITCODE -ne 0) { throw 'Isolated font runtime unavailable.' }
          & $fontPython -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r $requirements
          if ($LASTEXITCODE -ne 0) { throw 'Pinned font dependencies unavailable.' }
          $prepare = Join-Path $env:GITHUB_WORKSPACE 'trusted/scripts/publication/publication-font-decoder-prepare.mjs'
          node $prepare --destination (Join-Path $env:RUNNER_TEMP 'publication-eot-decoder')
          if ($LASTEXITCODE -ne 0) { throw 'Verified font decoder unavailable.' }
      - name: Scan candidate without executing candidate code
        shell: pwsh
        env:
          PUBLICATION_LANGUAGE_DATA: ${{ secrets.PUBLICATION_LANGUAGE_DATA }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE: ${{ github.event.before }}
          EVENT_TIP: ${{ github.sha }}
        run: |
          $scanner = Join-Path $env:GITHUB_WORKSPACE 'trusted/scripts/publication/run-publication-language-ci.mjs'
          $candidate = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $arguments = @('--regexp-interpret-all', $scanner, '--root', $candidate, '--tip', $env:EVENT_TIP, '--exceptions-file', (Join-Path $env:GITHUB_WORKSPACE 'trusted/scripts/publication/reviewed-exceptions.json'), '--font-python', (Join-Path $env:RUNNER_TEMP 'publication-font-python/Scripts/python.exe'), '--font-decoder-root', (Join-Path $env:RUNNER_TEMP 'publication-eot-decoder'))
          if ($env:EVENT_NAME -eq 'push') { $arguments += @('--base', $env:EVENT_BASE) }
          elseif ($env:EVENT_NAME -eq 'workflow_dispatch') { $arguments += @('--mode', 'current-tree-only') }
          else { throw 'Unsupported event.' }
          if ([string]::IsNullOrEmpty($env:PUBLICATION_LANGUAGE_DATA)) { throw 'Protected publication policy unavailable.' }
          $start = [Diagnostics.ProcessStartInfo]::new('node')
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          foreach ($argument in $arguments) { [void]$start.ArgumentList.Add($argument) }
          [void]$start.Environment.Remove('PUBLICATION_LANGUAGE_DATA')
          $child = [Diagnostics.Process]::Start($start)
          try {
            $child.StandardInput.Write($env:PUBLICATION_LANGUAGE_DATA)
            $child.StandardInput.Close()
            $env:PUBLICATION_LANGUAGE_DATA = $null
            $child.WaitForExit()
            if ($child.ExitCode -ne 0) { throw 'Publication scan failed or incomplete.' }
          } finally { $env:PUBLICATION_LANGUAGE_DATA = $null; $child.Dispose() }
