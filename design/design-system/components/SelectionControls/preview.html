<!-- @dsCard group="Inputs" height=220 subtitle="Switch, discrete slider, checkboxes" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SelectionControls preview</title></head>
<body>
<div class="sf-pad sf-col" style="max-width:440px">
<div class="sf-spread"><div><div class="body-large">Action sounds</div><div class="body-small sf-muted">Plays a short sound when a launch or task finishes.</div></div><span class="sf-switch" role="switch" aria-checked="true"></span></div>
<div><div class="sf-spread"><span class="body-medium">Funny level, English</span><span class="numeric">4</span></div><div class="sf-slider" role="slider" aria-valuemin="1" aria-valuemax="5" aria-valuenow="4"><div class="sf-slider__active" style="width:72%"></div><div class="sf-slider__handle"></div><div class="sf-slider__track"></div></div></div>
<div class="sf-row" style="gap:16px"><span class="sf-row"><span class="sf-check" role="checkbox" aria-checked="true"><span class="sf-i " aria-hidden="true">check</span></span>Retain workspace volume</span><span class="sf-row"><span class="sf-check" role="checkbox" aria-checked="false"></span>Erase on terminate</span></div>
</div>
</body>
</html>
