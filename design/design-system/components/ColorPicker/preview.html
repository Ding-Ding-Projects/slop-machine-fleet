<!-- @dsCard group="Personalization" height=440 subtitle="Swatches, recent, spectrum, hex/RGB/HSL/OKLCH, contrast readout, translator" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ColorPicker preview</title></head>
<body>
<div class="sf-pad"><div class="sf-card sf-card--high" style="max-width:520px;border-radius:var(--corner-extra-large);display:grid;grid-template-columns:200px 1fr;gap:16px">
<div class="sf-col" style="gap:8px"><div style="height:140px;border-radius:var(--corner-medium);background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,#c7f30d);position:relative"><span style="position:absolute;left:78%;top:12%;width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px #000"></span></div>
<div style="height:14px;border-radius:var(--corner-full);background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)"></div>
<div class="sf-row" style="gap:6px"><span style="width:24px;height:24px;border-radius:50%;background:var(--primary-fixed)"></span><span style="width:24px;height:24px;border-radius:50%;background:var(--tertiary)"></span><span style="width:24px;height:24px;border-radius:50%;background:var(--status-draining)"></span><span style="width:24px;height:24px;border-radius:50%;background:var(--status-failed)"></span><span class="label-small sf-muted">Recent</span></div></div>
<div class="sf-col" style="gap:12px"><div class="sf-row"><span style="width:40px;height:40px;border-radius:var(--corner-small);background:#c7f30d"></span><div><div class="sf-mono">#C7F30D</div><div class="body-small sf-muted">primary-fixed</div></div></div>
<div class="body-small sf-mono sf-muted">rgb(199 243 13)<br>hsl(72 90% 50%)<br>oklch(0.91 0.21 122)</div>
<div class="sf-row"><span class="sf-status sf-status--running"><span class="sf-i " aria-hidden="true">check_circle</span>14.6:1 on #171E00</span></div>
<div class="sf-tf"><div class="sf-tf__box" style="height:44px"><span class="sf-tf__input sf-mono" style="font-size:13px">"lime green, a bit darker"</span></div><span class="sf-tf__label">Translate a colour</span></div></div></div></div>
</body>
</html>
