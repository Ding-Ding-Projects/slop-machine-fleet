<!doctype html>
<html>
<head><meta charset="utf-8"><title>ExportDialog preview</title></head>
<body>
<div class="sf-scrim" style="height:360px"><div class="sf-dialog" style="max-width:480px"><h2 class="sf-dialog__headline">Export fleet records</h2>
<div class="sf-row"><button class="sf-chip" aria-selected="true"><span class="sf-i " aria-hidden="true">check</span>JSON</button><button class="sf-chip">CSV</button><button class="sf-chip">XLSX</button><button class="sf-chip">Markdown</button><button class="sf-chip">PDF</button><button class="sf-chip">HTML</button></div>
<div class="body-small sf-muted">Includes workers, templates, task history and audit events. Excludes sign-in codes, pairing codes and credentials.</div>
<div class="sf-dialog__actions"><button class="sf-btn sf-btn--text">Cancel</button><button class="sf-btn sf-btn--filled"><span class="sf-i " aria-hidden="true">download</span>Export JSON</button></div></div></div>
</body>
</html>
