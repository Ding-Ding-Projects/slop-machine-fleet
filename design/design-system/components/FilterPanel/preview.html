<!-- @dsCard group="Data" height=300 subtitle="Collapsible filters and statistics" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>FilterPanel preview</title></head>
<body>
<div class="sf-pad"><div class="sf-card sf-card--outlined" style="max-width:560px;padding:0">
<div class="sf-spread" style="padding:8px 8px 8px 16px"><span class="title-small">Filters and statistics</span><button class="sf-icon-btn" aria-label="Collapse filters" aria-expanded="true"><span class="sf-i " aria-hidden="true">expand_less</span></button></div><div class="sf-divider"></div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px">
<div><div class="headline-small sf-mono">5</div><div class="body-small sf-muted">Workers</div></div><div><div class="headline-small sf-mono" style="color:var(--status-running)">3</div><div class="body-small sf-muted">Running</div></div><div><div class="headline-small sf-mono" style="color:var(--status-failed)">1</div><div class="body-small sf-muted">Failed</div></div><div><div class="headline-small sf-mono">$0.47</div><div class="body-small sf-muted">Per hour</div></div></div>
<div class="sf-row" style="padding:0 16px 16px"><button class="sf-chip" aria-selected="true"><span class="sf-i " aria-hidden="true">check</span>Running</button><button class="sf-chip">Failed</button><button class="sf-chip">us-east-1</button><button class="sf-btn sf-btn--text sf-btn--sm">Clear</button></div></div></div>
</body>
</html>
