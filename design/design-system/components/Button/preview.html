<!-- @dsCard group="Actions" height=136 subtitle="Primary, secondary, ghost, danger; small and icon sizes" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"></head>
<body>
<div class="sf-row">
  <button class="sf-btn sf-btn--primary"><i class="ph-fill ph-rocket-launch"></i>Launch worker</button>
  <button class="sf-btn sf-btn--secondary"><i class="ph-fill ph-terminal-window"></i>Open shell</button>
  <button class="sf-btn sf-btn--ghost">View logs</button>
  <button class="sf-btn sf-btn--danger"><i class="ph-fill ph-power"></i>Terminate</button>
</div>
<div class="sf-row" style="padding-top:0">
  <button class="sf-btn sf-btn--primary sf-btn--sm">Assign task</button>
  <button class="sf-btn sf-btn--secondary sf-btn--sm">Snapshot</button>
  <button class="sf-btn sf-btn--secondary sf-btn--icon" aria-label="Refresh"><i class="ph-fill ph-arrows-clockwise"></i></button>
  <button class="sf-btn sf-btn--primary sf-btn--sm" disabled>Quota reached</button>
</div>
</body>
</html>
