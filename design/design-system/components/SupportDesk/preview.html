<!doctype html>
<html>
<head><meta charset="utf-8"><title>SupportDesk preview</title></head>
<body>
<div class="sf-pad"><div class="sf-card sf-card--outlined" style="max-width:560px;padding:0"><div class="sf-spread" style="padding:12px 16px"><span class="title-medium">Support tickets</span><button class="sf-btn sf-btn--tonal sf-btn--sm"><span class="sf-i " aria-hidden="true">add</span>New ticket</button></div>
<div class="sf-li"><span class="sf-i " aria-hidden="true">lock_reset</span><div class="sf-li__text"><span class="sf-li__headline">Locked out of a card lock</span><span class="sf-li__support">Step 2 of 3 · verify with authenticator</span></div><span class="sf-status sf-status--provisioning"><span class="sf-i sf-spin" aria-hidden="true">progress_activity</span>Open</span></div>
<div class="sf-li"><span class="sf-i " aria-hidden="true">sync_problem</span><div class="sf-li__text"><span class="sf-li__headline">Worker stuck in Draining</span><span class="sf-li__support">Resolved by forced reconcile, 01:12</span></div><span class="sf-status sf-status--running"><span class="sf-i " aria-hidden="true">check_circle</span>Resolved</span></div></div></div>
</body>
</html>
