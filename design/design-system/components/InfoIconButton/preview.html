<!-- @dsCard group="Actions" height=240 subtitle="One compact info icon above its control opens explanation, a worked example and a playground" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>InfoIconButton preview</title></head>
<body>
<div class="sf-pad" style="display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start">
<div class="sf-col" style="gap:4px"><div class="sf-spread"><span class="title-small">Machine cap</span><button class="sf-icon-btn sf-icon-btn--target" aria-label="About machine cap" aria-expanded="true" style="color:var(--tertiary)"><span class="sf-i " aria-hidden="true">info</span></button></div>
<div class="sf-tf"><div class="sf-tf__box"><span class="sf-tf__input sf-mono">5</span><span class="sf-muted">workers</span></div></div></div>
<div class="sf-card sf-card--outlined sf-col" style="gap:8px"><div class="title-medium">Machine cap</div><p class="body-medium sf-muted" style="margin:0">The most workers the fleet may run at once. Launches past the cap are blocked before any cost.</p>
<div class="sf-card" style="background:var(--tertiary-container);color:var(--on-tertiary-container);padding:12px"><div class="label-medium">Try it (sample only)</div><div class="body-medium">Cap 5, running 4: launching 2 shows "1 over the cap".</div><div class="sf-row" style="margin-top:8px"><button class="sf-btn sf-btn--sm sf-btn--tonal">Try launch 2</button><button class="sf-btn sf-btn--sm sf-btn--text" style="color:var(--on-tertiary-container)">Reset example</button></div></div></div>
</div>
</body>
</html>
