<!-- @dsCard group="Fleet" height=400 subtitle="Guided sign-in: official link, one-time code, expiry, cancel and verify" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>DeviceLoginPanel preview</title></head>
<body>
<div class="sf-pad"><div class="sf-card sf-col" style="max-width:520px;border-radius:var(--corner-extra-large);padding:24px;gap:16px">
<div class="sf-spread"><div><div class="label-medium sf-muted sf-mono">fleet-w-12</div><span class="headline-small">Sign in to Codex</span></div><span class="sf-status sf-status--draining"><span class="sf-i " aria-hidden="true">schedule</span>Expires 08:42</span></div>
<ol class="sf-steps" style="margin:0;padding:0;list-style:none">
<li class="sf-step sf-step--done"><span class="sf-step__dot"><span class="sf-i sf-i--18" aria-hidden="true">check</span></span><div><div class="sf-step__title">Device login started on the worker</div></div></li>
<li class="sf-step sf-step--current"><span class="sf-step__dot">2</span><div><div class="sf-step__title">Open the official page and enter this code</div><div class="sf-row" style="margin-top:8px;gap:12px"><span class="sf-otp" aria-label="Code, hidden until revealed">•••• ••••</span><button class="sf-btn sf-btn--tonal sf-btn--sm"><span class="sf-i " aria-hidden="true">visibility</span>Reveal</button><button class="sf-btn sf-btn--outlined sf-btn--sm"><span class="sf-i " aria-hidden="true">content_copy</span>Copy</button></div><div class="sf-step__meta" style="margin-top:4px">Code stays on this screen only. It is never logged, exported or captured.</div></div></li>
<li class="sf-step sf-step--todo"><span class="sf-step__dot">3</span><div><div class="sf-step__title">Verify with login status</div></div></li></ol>
<div class="sf-dialog__actions"><button class="sf-btn sf-btn--text">Cancel sign-in</button><button class="sf-btn sf-btn--brand"><span class="sf-i " aria-hidden="true">open_in_new</span>Open login page</button></div></div></div>
</body>
</html>
