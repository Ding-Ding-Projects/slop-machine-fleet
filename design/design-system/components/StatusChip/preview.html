<!-- @dsCard group="Status" height=96 subtitle="Five data colours, always a word plus an icon" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusChip preview</title></head>
<body>
<div class="sf-pad sf-row">
<span class="sf-status sf-status--running"><span class="sf-i " aria-hidden="true">check_circle</span>Running</span>
<span class="sf-status sf-status--provisioning"><span class="sf-i sf-spin" aria-hidden="true">progress_activity</span>Provisioning</span>
<span class="sf-status sf-status--draining"><span class="sf-i " aria-hidden="true">hourglass_top</span>Draining</span>
<span class="sf-status sf-status--failed"><span class="sf-i " aria-hidden="true">error</span>Failed</span>
<span class="sf-status sf-status--idle"><span class="sf-i " aria-hidden="true">pause_circle</span>Stopped</span>
</div>
</body>
</html>
