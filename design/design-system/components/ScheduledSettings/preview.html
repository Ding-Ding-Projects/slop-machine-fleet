<!-- @dsCard group="Personalization" height=300 subtitle="Schedule theme, language and any appearance value" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ScheduledSettings preview</title></head>
<body>
<div class="sf-pad"><div class="sf-card sf-card--outlined" style="max-width:560px;padding:0"><div class="sf-spread" style="padding:12px 16px"><span class="title-medium">Scheduled settings</span><button class="sf-btn sf-btn--tonal sf-btn--sm"><span class="sf-i " aria-hidden="true">add</span>Add schedule</button></div>
<div class="sf-li"><span class="sf-i " aria-hidden="true">dark_mode</span><div class="sf-li__text"><span class="sf-li__headline">Theme: Dark</span><span class="sf-li__support">Every day 19:00 to 07:00</span></div><span class="sf-switch" role="switch" aria-checked="true"></span></div>
<div class="sf-li"><span class="sf-i " aria-hidden="true">translate</span><div class="sf-li__text"><span class="sf-li__headline">Language: 廣東話</span><span class="sf-li__support">Weekends</span></div><span class="sf-switch" role="switch" aria-checked="false"></span></div>
<div class="sf-li"><span class="sf-i " aria-hidden="true">text_increase</span><div class="sf-li__text"><span class="sf-li__headline">Font size: 110%</span><span class="sf-li__support">From an external file, last read 01:30</span></div><span class="sf-switch" role="switch" aria-checked="true"></span></div></div></div>
</body>
</html>
