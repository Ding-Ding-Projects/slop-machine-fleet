<!-- @dsCard group="Safety" height=420 subtitle="Two-key confirmation for irreversible actions with an exact resource summary" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SuperConfirmation preview</title></head>
<body>
<div class="sf-scrim" style="height:400px"><div class="sf-dialog">
<span class="sf-i sf-dialog__icon" style="color:var(--error)">delete_forever</span><h2 class="sf-dialog__headline" style="text-align:center">Erase fleet-w-09 data?</h2>
<div class="sf-card" style="background:var(--error-container);color:var(--on-error-container);padding:12px"><div class="body-medium">Deletes permanently: workspace volume vol-0c1d… (100 GiB) and snapshot snap-07a…. The machine is already terminated.</div></div>
<div class="sf-tf sf-tf--focused"><div class="sf-tf__box sf-tf__box--focused"><span class="sf-tf__input sf-mono">fleet-w-0</span></div><span class="sf-tf__label">Type fleet-w-09 to confirm</span></div>
<div class="sf-row"><span class="sf-check" role="checkbox" aria-checked="false"></span><span class="body-medium">I understand this cannot be undone</span></div>
<div class="sf-dialog__actions"><button class="sf-btn sf-btn--text">Cancel</button><button class="sf-btn sf-btn--danger" disabled>Erase permanently</button></div></div></div>
</body>
</html>
