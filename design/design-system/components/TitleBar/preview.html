<!doctype html>
<html>
<head><meta charset="utf-8"><title>TitleBar preview</title></head>
<body>
<div class="sf-titlebar"><span class="sf-i" style="color:var(--primary)">deployed_code</span><span class="sf-titlebar__name">Slop Machine Fleet</span><span class="body-small sf-muted">· 4 of 5 running</span><div class="sf-titlebar__drag"></div><button class="sf-icon-btn sf-icon-btn--sm" aria-label="Command palette (Ctrl+Shift+F)"><span class="sf-i " aria-hidden="true">search</span></button><button class="sf-icon-btn sf-icon-btn--sm" aria-label="Notifications, 2 new" style="position:relative"><span class="sf-i " aria-hidden="true">notifications</span><span class="sf-badge" style="position:absolute;top:2px;right:2px">2</span></button><button class="sf-winbtn" aria-label="Minimize"><span class="sf-i " aria-hidden="true">remove</span></button><button class="sf-winbtn" aria-label="Maximize"><span class="sf-i " aria-hidden="true">crop_square</span></button><button class="sf-winbtn sf-winbtn--close" aria-label="Close"><span class="sf-i " aria-hidden="true">close</span></button></div>
