<!-- @dsCard group="Navigation" height=330 subtitle="Every search owns an adjacent, independent full regex builder" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SearchWithRegexBuilder preview</title></head>
<body>
<div class="sf-pad sf-col" style="max-width:640px">
<div class="sf-search"><span class="sf-i " aria-hidden="true">search</span><span class="sf-search__q sf-mono">^fleet-w-0[5-9]$</span><span class="sf-status sf-status--running" style="height:24px"><span class="sf-i " aria-hidden="true">check</span>4 matches</span><button class="sf-icon-btn" aria-label="Open regex builder for worker search" aria-expanded="true" style="color:var(--tertiary)"><span class="sf-i " aria-hidden="true">regular_expression</span></button></div>
<div class="sf-card sf-card--high" style="box-shadow:var(--elevation-2);border-radius:var(--corner-extra-large)">
<div class="sf-spread"><span class="title-medium">Regex builder: Workers</span><div class="sf-seg" style="height:32px"><button aria-pressed="true" style="font-size:12px">ECMAScript</button><button aria-pressed="false" style="font-size:12px">.NET</button><button aria-pressed="false" style="font-size:12px">PCRE2</button></div></div>
<div class="sf-row" style="margin:12px 0"><span class="sf-chip" aria-selected="true">^ start</span><span class="sf-chip" aria-selected="true">literal fleet-w-0</span><span class="sf-chip" aria-selected="true">class [5-9]</span><span class="sf-chip" aria-selected="true">$ end</span><span class="sf-chip"><span class="sf-i " aria-hidden="true">add</span>Token</span></div>
<div class="body-small sf-muted">Test against: fleet-w-05 <b style="color:var(--status-running)">match</b> · fleet-w-12 <b style="color:var(--on-surface)">no match</b> · flavors, flags, groups, debugger and library in the full builder.</div></div>
</div>
</body>
</html>
