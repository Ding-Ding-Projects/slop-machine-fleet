<!-- @dsCard group="Navigation" height=300 subtitle="Ctrl K: jump to a worker or run a fleet action" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>CommandBar — preview</title><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"></head>
<body>
<div style="padding:16px">
<div class="sf-cmd" role="dialog" aria-label="Command bar">
  <div class="sf-cmd__search"><i class="ph-fill ph-magnifying-glass"></i><span class="sf-cmd__query">w-07</span><span class="sf-kbd">Esc</span></div>
  <div class="sf-cmd__group">Workers</div>
  <div class="sf-cmd__list">
    <div class="sf-cmd-item sf-cmd-item--active"><i class="ph-fill ph-desktop-tower"></i><span class="sf-mono">fleet-w-07</span><span class="sf-pill sf-pill--running">Running</span><span class="sf-cmd-item__hint"><span class="sf-kbd">↵</span></span></div>
    <div class="sf-cmd-item"><i class="ph-fill ph-terminal-window"></i>Open shell on fleet-w-07<span class="sf-cmd-item__hint"><span class="sf-kbd">Ctrl</span><span class="sf-kbd">T</span></span></div>
    <div class="sf-cmd-item"><i class="ph-fill ph-stop-circle"></i>Drain fleet-w-07<span class="sf-cmd-item__hint"><span class="sf-kbd">Ctrl</span><span class="sf-kbd">D</span></span></div>
  </div>
</div>
</div>
</body>
</html>
