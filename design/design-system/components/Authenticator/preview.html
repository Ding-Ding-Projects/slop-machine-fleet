<!-- @dsCard group="Safety" height=380 subtitle="Built-in TOTP codes with countdown, and QR pairing" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Authenticator preview</title></head>
<body>
<div class="sf-pad sf-row" style="align-items:flex-start;gap:16px">
<div class="sf-card sf-card--outlined" style="width:320px;padding:0"><div class="sf-li"><div class="sf-ring" style="--p:62;--ring-ground:var(--surface)"><span>18</span></div><div class="sf-li__text"><span class="sf-li__overline">Fleet console</span><span class="sf-otp sf-otp--sm">482 913</span></div><button class="sf-icon-btn" aria-label="Copy code"><span class="sf-i " aria-hidden="true">content_copy</span></button></div><div class="sf-divider"></div>
<div class="sf-li"><div class="sf-ring" style="--p:62;--ring-ground:var(--surface)"><span>18</span></div><div class="sf-li__text"><span class="sf-li__overline">Card lock: fleet-w-07</span><span class="sf-otp sf-otp--sm">•••&nbsp;•••</span></div><button class="sf-icon-btn" aria-label="Reveal code"><span class="sf-i " aria-hidden="true">visibility</span></button></div></div>
<div class="sf-card sf-col" style="width:240px;align-items:center;text-align:center;gap:8px"><div style="width:148px;height:148px;background:#fff;border-radius:var(--corner-small);display:grid;place-items:center;color:#111" role="img" aria-label="QR code hidden until revealed"><span class="sf-i sf-i--24" aria-hidden="true">qr_code_2</span></div><span class="title-small">Pair an authenticator</span><button class="sf-btn sf-btn--tonal sf-btn--sm">Reveal QR</button></div></div>
</body>
</html>
