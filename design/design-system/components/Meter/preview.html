<!-- @dsCard group="Data" height=132 subtitle="CPU, memory and disk usage with aligned mono values" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Meter — preview</title><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"></head>
<body>
<div class="sf-stack" style="max-width:360px">
  <div class="sf-meter"><span class="sf-meter__label">CPU</span><div class="sf-meter__track"><div class="sf-meter__fill" style="width:38%"></div></div><span class="sf-meter__value">38%</span></div>
  <div class="sf-meter"><span class="sf-meter__label">Mem</span><div class="sf-meter__track"><div class="sf-meter__fill sf-meter__fill--warn" style="width:74%"></div></div><span class="sf-meter__value">74%</span></div>
  <div class="sf-meter"><span class="sf-meter__label">Disk</span><div class="sf-meter__track"><div class="sf-meter__fill sf-meter__fill--hot" style="width:93%"></div></div><span class="sf-meter__value">93%</span></div>
</div>
</body>
</html>
