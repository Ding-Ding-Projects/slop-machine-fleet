<!-- @dsCard group="Fleet" height=520 subtitle="One isolated Windows worker: identity, state, load, actions" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>WorkerTile — preview</title><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"></head>
<body>
<div class="sf-row" style="align-items:flex-start;gap:16px">
  <article class="sf-tile sf-tile--selected" tabindex="0">
    <div class="sf-tile__head">
      <div><div class="sf-tile__eyebrow">us-east-1a</div><div class="sf-tile__name">fleet-w-07</div><div class="sf-tile__meta">m7i.2xlarge · 8 vCPU · 32 GiB</div></div>
      <span class="sf-pill sf-pill--running">Running</span>
    </div>
    <div class="sf-meter"><span class="sf-meter__label">CPU</span><div class="sf-meter__track"><div class="sf-meter__fill" style="width:62%"></div></div><span class="sf-meter__value">62%</span></div>
    <div class="sf-meter"><span class="sf-meter__label">Mem</span><div class="sf-meter__track"><div class="sf-meter__fill sf-meter__fill--warn" style="width:78%"></div></div><span class="sf-meter__value">78%</span></div>
    <div class="sf-tile__foot"><span class="sf-tile__meta">Task 3 of 5 · 41m</span><button class="sf-btn sf-btn--secondary sf-btn--sm"><i class="ph-fill ph-terminal-window"></i>Shell</button></div>
  </article>
  <article class="sf-tile" tabindex="0">
    <div class="sf-tile__head">
      <div><div class="sf-tile__eyebrow">eu-west-2b</div><div class="sf-tile__name">fleet-w-12</div><div class="sf-tile__meta">c7i.xlarge · 4 vCPU · 8 GiB</div></div>
      <span class="sf-pill sf-pill--provisioning">Booting</span>
    </div>
    <div class="sf-meter"><span class="sf-meter__label">CPU</span><div class="sf-meter__track"><div class="sf-meter__fill" style="width:9%"></div></div><span class="sf-meter__value">9%</span></div>
    <div class="sf-meter"><span class="sf-meter__label">Mem</span><div class="sf-meter__track"><div class="sf-meter__fill" style="width:14%"></div></div><span class="sf-meter__value">14%</span></div>
    <div class="sf-tile__foot"><span class="sf-tile__meta">Waiting for agent</span><button class="sf-btn sf-btn--ghost sf-btn--sm">Logs</button></div>
  </article>
</div>
</body>
</html>
