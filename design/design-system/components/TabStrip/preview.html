<!-- @dsCard group="Window" height=120 subtitle="Browser-style tabs with pinning, colour groups, overflow and tab search" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>TabStrip preview</title></head>
<body>
<div class="sf-tabs" role="tablist">
<div class="sf-tab sf-tab--pinned" role="tab" aria-label="Fleet (pinned)"><span class="sf-i " aria-hidden="true">dashboard</span></div>
<span class="sf-tabgroup sf-tabgroup--lime">Workers</span>
<div class="sf-tab sf-tab--in-lime" role="tab" aria-selected="true"><span class="sf-i " aria-hidden="true">desktop_windows</span><span class="sf-tab__title sf-mono">fleet-w-07</span><span class="sf-tab__close"><span class="sf-i sf-i--18" aria-hidden="true">close</span></span></div>
<div class="sf-tab sf-tab--in-lime" role="tab"><span class="sf-i " aria-hidden="true">desktop_windows</span><span class="sf-tab__title sf-mono">fleet-w-12</span></div>
<span class="sf-tabgroup sf-tabgroup--teal">Setup</span>
<div class="sf-tab sf-tab--in-teal" role="tab"><span class="sf-i " aria-hidden="true">key</span><span class="sf-tab__title">Sign-in</span></div>
<div class="sf-tab" role="tab"><span class="sf-i " aria-hidden="true">history</span><span class="sf-tab__title">History</span></div>
<div style="flex:1"></div><button class="sf-icon-btn sf-icon-btn--sm" aria-label="Search tabs"><span class="sf-i " aria-hidden="true">manage_search</span></button><button class="sf-icon-btn sf-icon-btn--sm" aria-label="New tab"><span class="sf-i " aria-hidden="true">add</span></button></div>
<div style="height:56px;background:var(--surface)"></div>
</body>
</html>
