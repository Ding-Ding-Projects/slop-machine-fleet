<!-- @dsCard group="Personalization" height=480 subtitle="Per-element editor with Word-depth typography, presets, locks and reset" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>AppearanceEditor preview</title></head>
<body>
<div class="sf-pad" style="display:grid;grid-template-columns:1fr 300px;gap:16px">
<div class="sf-col"><div class="label-medium sf-muted">Editing: Worker card › Title</div><div class="sf-card sf-card--selected" style="max-width:280px;outline:2px dashed var(--tertiary);outline-offset:6px"><div class="title-large sf-mono" style="font-weight:700;letter-spacing:.02em">fleet-w-07</div><div class="body-small sf-muted">US-EAST-1A · t3.large</div></div>
<div class="sf-row"><button class="sf-chip" aria-selected="true"><span class="sf-i " aria-hidden="true">check</span>This element</button><button class="sf-chip">All worker cards</button><button class="sf-chip">Whole app</button></div></div>
<div class="sf-card sf-card--high sf-col" style="gap:12px;border-radius:var(--corner-extra-large)">
<div class="sf-search" style="height:44px;background:var(--surface-container-highest)"><span class="sf-i " aria-hidden="true">search</span><span class="sf-search__placeholder sf-grow">Search properties</span><span class="sf-i " aria-hidden="true">regular_expression</span></div>
<div class="sf-tf"><div class="sf-tf__box" style="height:48px"><span class="sf-tf__input" style="font-family:var(--font-mono)">Geist Mono</span><span class="sf-i " aria-hidden="true">arrow_drop_down</span></div><span class="sf-tf__label">Font family</span></div>
<div class="sf-row"><div class="sf-tf" style="width:96px"><div class="sf-tf__box" style="height:48px"><span class="sf-tf__input">22</span>px</div><span class="sf-tf__label">Size</span></div><div class="sf-seg" style="height:48px"><button aria-pressed="true" aria-label="Bold"><span class="sf-i " aria-hidden="true">format_bold</span></button><button aria-pressed="false" aria-label="Italic"><span class="sf-i " aria-hidden="true">format_italic</span></button><button aria-pressed="false" aria-label="Underline"><span class="sf-i " aria-hidden="true">format_underlined</span></button><button aria-pressed="false" aria-label="Strikethrough"><span class="sf-i " aria-hidden="true">strikethrough_s</span></button></div></div>
<div class="body-small sf-muted">Also: spacing, line height, case, small caps, sub/superscript, outline, shadow, glow, colour, highlight, radius, elevation, density, motion.</div>
<div class="sf-spread"><button class="sf-btn sf-btn--text sf-btn--sm"><span class="sf-i " aria-hidden="true">lock</span>Lock</button><button class="sf-btn sf-btn--text sf-btn--sm">Reset element</button><button class="sf-btn sf-btn--tonal sf-btn--sm">Save preset</button></div></div></div>
</body>
</html>
