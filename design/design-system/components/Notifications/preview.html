<!-- @dsCard group="Feedback" height=330 subtitle="Non-blocking snackbar plus the reviewable notification centre" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Notifications preview</title></head>
<body>
<div class="sf-pad sf-col" style="gap:16px">
<div class="sf-snackbar"><span class="sf-i " aria-hidden="true">check_circle</span><span class="sf-grow">fleet-w-07 finished task 3 of 5.</span><button class="sf-btn sf-btn--text sf-btn--sm">Review</button><button class="sf-icon-btn sf-icon-btn--sm" aria-label="Dismiss"><span class="sf-i " aria-hidden="true">close</span></button></div>
<div class="sf-card sf-card--high" style="padding:0;max-width:440px;box-shadow:var(--elevation-2);border-radius:var(--corner-extra-large)"><div class="sf-spread" style="padding:12px 16px"><span class="title-medium">Notifications</span><button class="sf-btn sf-btn--text sf-btn--sm">Mark all read</button></div>
<div class="sf-li sf-li--dense"><span class="sf-status sf-status--draining"><span class="sf-i " aria-hidden="true">schedule</span></span><div class="sf-li__text"><span class="body-medium">Sign-in code expires in 2 min</span><span class="body-small sf-muted">fleet-w-12 · 01:44</span></div></div>
<div class="sf-li sf-li--dense"><span class="sf-status sf-status--failed"><span class="sf-i " aria-hidden="true">error</span></span><div class="sf-li__text"><span class="body-medium">Launch failed: capacity</span><span class="body-small sf-muted">fleet-w-13 · 01:39 · Retry ready</span></div></div></div>
</div>
</body>
</html>
