<!-- @dsCard group="Personalization" height=260 subtitle="Narrator voice pickers and action sounds" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>VoiceAndSound preview</title></head>
<body>
<div class="sf-pad"><div class="sf-card sf-col" style="max-width:520px;gap:12px">
<div class="sf-spread"><span class="title-medium">Narrator</span><span class="sf-switch" role="switch" aria-checked="true"></span></div>
<div class="sf-row"><div class="sf-tf sf-grow"><div class="sf-tf__box" style="height:48px"><span class="sf-i " aria-hidden="true">record_voice_over</span><span class="sf-tf__input">English voice: Aria</span><span class="sf-i " aria-hidden="true">arrow_drop_down</span></div></div><button class="sf-icon-btn sf-icon-btn--tonal" aria-label="Preview English voice"><span class="sf-i " aria-hidden="true">play_arrow</span></button></div>
<div class="sf-row"><div class="sf-tf sf-grow"><div class="sf-tf__box" style="height:48px"><span class="sf-i " aria-hidden="true">record_voice_over</span><span class="sf-tf__input">粵語聲線: HiuGaai</span><span class="sf-i " aria-hidden="true">arrow_drop_down</span></div></div><button class="sf-icon-btn sf-icon-btn--tonal" aria-label="Preview Cantonese voice"><span class="sf-i " aria-hidden="true">play_arrow</span></button></div>
<div class="sf-spread"><span class="body-medium">Action sounds</span><span class="sf-switch" role="switch" aria-checked="true"></span></div></div></div>
</body>
</html>
